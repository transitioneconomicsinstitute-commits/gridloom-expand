[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[project]
name = "gridloom-expand"
version = "0.1.0"
description = "Basic economic expansion of generators and transmission on top of gridloom-dispatch"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Transition Economics Institute"}]
requires-python = ">=3.9"
dependencies = ["gridloom-dispatch>=0.1", "numpy", "pandas"]
[project.optional-dependencies]
test = ["pytest"]
[project.scripts]
gridloom-expand = "gridloom_expand.__main__:main"
[tool.setuptools]
packages = ["gridloom_expand"]
